name: detections

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate metadata, ATT&CK mappings and fixtures
        run: python tools/validate.py
      - name: Coverage is up to date
        run: |
          python tools/coverage.py
          git diff --exit-code coverage/ || (echo "Run python tools/coverage.py and commit the result" && exit 1)

  test:
    runs-on: ubuntu-latest
    needs: validate
    services:
      kusto:
        image: mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest
        env:
          ACCEPT_EULA: "Y"
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run detections against attack and benign fixtures
        run: python tools/run_tests.py --url http://localhost:8080
